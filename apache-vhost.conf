<VirtualHost *:80>
    # Solo public/ es accesible desde la web. El resto de la aplicación (app/, config/,
    # scripts/, schema.sql, .env) queda FUERA del directorio servido: aunque alguien
    # adivine la ruta, Apache no tiene nada que entregarle.
    DocumentRoot /var/www/html/public

    # El manifest de "Agregar a la pantalla de inicio" (Android lo exige con este tipo).
    AddType application/manifest+json .webmanifest

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Un archivo real de public/ (assets/css, assets/js, imágenes) se sirve tal cual.
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]

        # Todo lo demás lo resuelve el front controller, que se encarga de separar el
        # slug de la copa del resto de la ruta (/liga-municipal/tabla.php) y de elegir
        # el controlador. Ver public/index.php y config/rutas.php.
        RewriteRule ^ index.php [L]
    </Directory>
</VirtualHost>
